<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waypoint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Waypoint matches students and graduates to scholarships, internships, job shadowing and postgraduate programs, and shows exactly what each one needs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..800&family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap">
<style>
/* Layout concept: calm and simple. One column of clean cards, generous white space, one dark primary
   action per screen, colour only where it carries meaning (type, match, urgency). */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --surface-2: #F1F3F6; --ink: #111827; --ink-2: #4B5563; --ink-3: #9CA3AF; --line: #E5E7EB;
  --accent: #E5372B; --accent-2: #2563EB; --ok: #16A34A; --ok-soft: #E9F7EE; --urgent: #DC2626; --urgent-soft: #FDECEC; --warn: #B45309;
  --t-internship: #2563EB; --t-scholarship: #D97706; --t-shadowing: #059669; --t-postgrad: #7C3AED;
  --shadow-sm: 0 1px 2px rgba(17, 24, 39, .05);
  --shadow-md: 0 12px 32px -14px rgba(17, 24, 39, .22), 0 2px 6px rgba(17, 24, 39, .04);
  --shadow-lg: 0 30px 70px -28px rgba(17, 24, 39, .35);
  --scrim: rgba(17, 24, 39, .32);
  --focus: #2563EB;
  --f-display: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gl: max(20px, env(safe-area-inset-left, 0px));
  --gr: max(20px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B0D12; --surface: #14171E; --surface-2: #1B1F28; --ink: #F3F4F6; --ink-2: #A3AAB7; --ink-3: #6B7280; --line: #262B35;
    --accent: #FF5A4D; --accent-2: #60A5FA; --ok: #34D399; --ok-soft: #0F2A1F; --urgent: #F87171; --urgent-soft: #2B1717; --warn: #FBBF24;
    --t-internship: #60A5FA; --t-scholarship: #FBBF24; --t-shadowing: #34D399; --t-postgrad: #A78BFA;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-md: 0 12px 32px -12px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .35);
    --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .8);
    --scrim: rgba(0, 0, 0, .6);
    --focus: #60A5FA;
    color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0B0D12; --surface: #14171E; --surface-2: #1B1F28; --ink: #F3F4F6; --ink-2: #A3AAB7; --ink-3: #6B7280; --line: #262B35;
    --accent: #FF5A4D; --accent-2: #60A5FA; --ok: #34D399; --ok-soft: #0F2A1F; --urgent: #F87171; --urgent-soft: #2B1717; --warn: #FBBF24;
    --t-internship: #60A5FA; --t-scholarship: #FBBF24; --t-shadowing: #34D399; --t-postgrad: #A78BFA;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-md: 0 12px 32px -12px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .35);
    --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .8);
    --scrim: rgba(0, 0, 0, .6);
    --focus: #60A5FA;
    color-scheme: dark; }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 90; }
body.no-scroll { overflow: hidden; }
#app { min-height: 100vh; min-height: 100dvh; }
svg { display: block; }
.ic { display: inline-block; flex: none; vertical-align: middle; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; }
input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); text-wrap: balance; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--ink-3); }
.sp { flex: 1; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding-left: var(--gl); padding-right: var(--gr); }

/* ---------- Buttons ---------- */
.btn { --bh: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--bh); padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font: 650 15px/1 var(--f-display); white-space: nowrap; transition: transform .15s var(--ease), background-color .15s, box-shadow .15s, border-color .15s, opacity .15s; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; transform: none; }
.btn .ic-arrow { transition: transform .2s var(--ease); }
.btn:hover .ic-arrow { transform: translateX(3px); }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover:not(:disabled) { box-shadow: var(--shadow-md); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover:not(:disabled) { border-color: var(--ink-3); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-sm { --bh: 36px; padding: 0 13px; font-size: 14px; border-radius: 10px; }
.btn-lg { --bh: 52px; padding: 0 24px; font-size: 16px; border-radius: 14px; }
.btn-block { width: 100%; }
/* Full-width buttons and buttons in sheets can carry long names: let them wrap instead of cutting off. */
.btn-block, .pro-sheet .btn { white-space: normal; height: auto; min-height: var(--bh); padding-top: 10px; padding-bottom: 10px; line-height: 1.25; text-align: center; }
.btn-block > svg, .pro-sheet .btn > svg { flex: none; }
.btn-link { font-weight: 650; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; transition: text-decoration-color .15s; }
.btn-link:hover { text-decoration-color: var(--ink); }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--ink-2); transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---------- Header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 var(--gr) 0 var(--gl); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.logo { display: inline-flex; align-items: center; gap: 9px; font: 800 20px/1 var(--f-display); letter-spacing: -.03em; color: var(--ink); }
.logo-mark { color: var(--ink); }

/* ---------- Small pieces ---------- */
.tl { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.tl i { width: 8px; height: 8px; border-radius: 50%; background: var(--t-internship); }
.tl[data-t="scholarship"] i { background: var(--t-scholarship); }
.tl[data-t="shadowing"] i { background: var(--t-shadowing); }
.tl[data-t="postgrad"] i { background: var(--t-postgrad); }
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; }
.ring b { position: relative; font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 700; }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.prog { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.prog > span { display: block; height: 100%; border-radius: inherit; background: var(--ink); transition: width .4s var(--ease); }

/* ---------- Opportunity card ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { display: grid; gap: 14px; align-content: start; min-width: 0; padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); text-align: left; transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: transparent; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.card-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.card-tx { display: grid; gap: 4px; min-width: 0; }
.card-t { font: 750 18px/1.25 var(--f-display); letter-spacing: -.015em; color: var(--ink); }
.card-o { font-size: 14.5px; color: var(--ink-2); }
.card-o em { font-style: normal; color: var(--ink-3); }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 9px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 600; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tag .ic { color: var(--ink-3); }
.tag-urgent { background: var(--urgent-soft); color: var(--urgent); }
.tag-urgent .ic { color: var(--urgent); }

/* ---------- Landing ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; padding-top: clamp(40px, 8vw, 104px); padding-bottom: clamp(56px, 8vw, 104px); }
.hero-copy { display: grid; gap: 22px; }
.hero-h { font: 800 clamp(2.6rem, 5.6vw, 4.4rem)/1.02 var(--f-display); letter-spacing: -.04em; }
.hero-sub { font-size: clamp(1.08rem, 1.5vw, 1.25rem); color: var(--ink-2); max-width: 30em; }
.hero-ctas { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-top: 4px; }
.hero-also { font-size: 14px; color: var(--ink-3); max-width: 34em; }
.hero-vis { position: relative; padding-top: 92px; }
.stack { position: absolute; left: 0; right: 0; margin: 0 auto; width: min(460px, 100%); transition: transform .4s var(--ease); }
.stack .card { pointer-events: none; }
.stack-0 { z-index: 3; position: relative; }
.stack-1 { z-index: 2; top: 46px; transform: scale(.94); }
.stack-2 { z-index: 1; top: 0; transform: scale(.88); }
.stack-1 .card, .stack-2 .card { position: relative; overflow: hidden; }
.stack-1 .card::after, .stack-2 .card::after { content: ""; position: absolute; inset: 0; background: var(--bg); opacity: .45; }
.stack-2 .card::after { opacity: .65; }
.stack-0 .card { box-shadow: var(--shadow-lg); border-color: transparent; }
.hero-vis:hover .stack-1 { transform: scale(.94) translateY(-12px); }
.hero-vis:hover .stack-2 { transform: scale(.88) translateY(-24px); }
.how { padding-top: 8px; padding-bottom: 72px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.steps li { display: grid; gap: 4px; padding: 22px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.steps b { font: 750 17px/1.3 var(--f-display); margin-top: 10px; }
.steps span:last-child { color: var(--ink-2); font-size: 14.5px; }
.step-ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); color: var(--ink); }
.foot { padding-top: 24px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13px; text-align: center; }

/* ---------- Auth ---------- */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
.auth-main { display: grid; place-items: center; padding: 24px var(--gr) 64px var(--gl); }
.auth-card { display: grid; gap: 16px; width: min(420px, 100%); padding: 32px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-md); }
.auth-h { font: 800 30px/1.1 var(--f-display); letter-spacing: -.03em; }
.auth-p { color: var(--ink-2); margin-top: -8px; }
.auth-alt { text-align: center; font-size: 14px; color: var(--ink-2); }
.or { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; color: var(--ink-3); font-size: 13px; }
.or::before, .or::after { content: ""; height: 1px; background: var(--line); }
.fine { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.field { display: grid; gap: 7px; }
.field > label, .field .label { font-weight: 700; font-size: 14px; }
.input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 16px; transition: border-color .15s, box-shadow .15s; }
.input::placeholder { color: var(--ink-3); }
.input:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 16%, transparent); }
.input-wrap { position: relative; }
.input-wrap > .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.input-ic { padding-left: 42px; }
.input-wrap-r .input { padding-right: 48px; }
.pw-eye { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; color: var(--ink-3); }
.pw-eye:hover { background: var(--surface-2); color: var(--ink); }
.form-err { padding: 10px 12px; border-radius: 10px; background: var(--urgent-soft); color: var(--urgent); font-size: 14px; font-weight: 650; }
.combo { position: relative; }
.combo-list { position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; right: 0; max-height: 280px; overflow: auto; padding: 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.combo-opt { display: flex; width: 100%; padding: 10px 12px; border-radius: 9px; font-size: 15px; }
.combo-opt.act, .combo-opt:hover { background: var(--surface-2); }
.combo-empty { padding: 12px; color: var(--ink-3); font-size: 14px; }

/* ---------- The five questions ---------- */
.ci { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
.ci-prog { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--ink-3); font-size: 13px; font-weight: 650; }
.ci-prog .prog { width: min(260px, 40vw); }
.ci-main { display: grid; gap: 26px; align-content: start; max-width: 720px; padding-top: clamp(24px, 6vh, 64px); padding-bottom: 40px; animation: qIn .35s var(--ease) both; }
@keyframes qIn { from { transform: translateY(10px); } }
.ci-h { font: 800 clamp(2rem, 4.4vw, 2.9rem)/1.08 var(--f-display); letter-spacing: -.035em; }
.ci-note { color: var(--ink-3); font-size: 14px; margin-top: -10px; }
.ci-foot { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px var(--gr) calc(14px + env(safe-area-inset-bottom, 0px)) var(--gl); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.ci-live { color: var(--ink-3); font-size: 14px; }
.ci-live b { color: var(--ink); font-weight: 750; }
.age { display: flex; align-items: center; gap: 28px; }
.age-num { min-width: 2.2ch; text-align: center; font: 800 clamp(88px, 13vw, 132px)/1 var(--f-display); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.round-btn { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--ink); transition: border-color .15s, transform .15s; }
.round-btn:hover { border-color: var(--ink-3); transform: scale(1.05); }
.slider { -webkit-appearance: none; appearance: none; width: 100%; max-width: 520px; height: 28px; margin: 0; background: transparent; cursor: pointer; }
.slider::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--ink) var(--p), var(--line) var(--p)); }
.slider::-moz-range-track { height: 6px; border-radius: 99px; background: var(--line); }
.slider::-moz-range-progress { height: 6px; border-radius: 99px; background: var(--ink); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); box-shadow: var(--shadow-md); }
.slider::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.opts { display: grid; gap: 10px; }
.opts-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px 16px 14px 14px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; transition: border-color .15s, box-shadow .15s; }
.opt:hover { border-color: var(--ink-3); }
.opt.on { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent); }
.opt-ic { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); color: var(--ink); }
.opt.on .opt-ic { background: var(--ink); color: var(--bg); }
.opt[data-t="internship"] .opt-ic { color: var(--t-internship); }
.opt[data-t="scholarship"] .opt-ic { color: var(--t-scholarship); }
.opt[data-t="shadowing"] .opt-ic { color: var(--t-shadowing); }
.opt[data-t="postgrad"] .opt-ic { color: var(--t-postgrad); }
.opt[data-t].on .opt-ic { color: var(--bg); }
.opt-tx { display: grid; line-height: 1.3; min-width: 0; padding-right: 22px; }
.opt-tx b { font: 700 16px var(--f-display); }
.opt-tx span { font-size: 14px; color: var(--ink-3); }
.tick { position: absolute; top: 12px; right: 12px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); color: var(--bg); }
.opt.on .tick { background: var(--ink); border-color: var(--ink); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { height: 44px; padding: 0 16px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 650; font-size: 15px; color: var(--ink); transition: all .15s; }
.pill:hover { border-color: var(--ink-3); }
.pill.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pills-sm { margin-top: -12px; }
.pills-sm .pill { height: 36px; padding: 0 13px; font-size: 14px; }

/* ---------- Home ---------- */
.home-in { display: grid; gap: 22px; padding-top: 28px; padding-bottom: 80px; }
.home-head { display: grid; gap: 6px; }
.home-h { font: 800 clamp(2rem, 4vw, 2.7rem)/1.05 var(--f-display); letter-spacing: -.035em; }
.home-sub { color: var(--ink-2); font-size: 16px; }
.home-sub b { color: var(--ink); }
.next { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 14px 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.next-ic { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--urgent-soft); color: var(--accent); }
.next-tx { display: grid; line-height: 1.35; min-width: 0; }
.next-tx b { font-size: 15px; }
.next-tx span { font-size: 13.5px; color: var(--ink-3); }
.next-how { grid-column: 1 / -1; display: grid; gap: 14px; justify-items: start; padding: 4px 4px 4px 52px; }
.next-how ol { counter-reset: s; display: grid; gap: 8px; }
.next-how li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.next-how li::before { content: counter(s); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--ink); font-size: 12px; font-weight: 700; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 15px; border-radius: 99px; font-weight: 650; font-size: 14.5px; color: var(--ink-2); white-space: nowrap; flex: none; transition: background .15s, color .15s; }
.tab span { font-size: 12.5px; color: var(--ink-3); }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab.on { background: var(--ink); color: var(--bg); }
.tab.on span { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.more-btn { justify-self: center; }
.more-h { font: 750 20px/1.2 var(--f-display); margin-top: 12px; }
.empty { display: grid; justify-items: center; gap: 8px; padding: 48px 20px; border-radius: 18px; border: 1.5px dashed var(--line); text-align: center; color: var(--ink-2); }
.empty b { font: 750 18px var(--f-display); color: var(--ink); }
.empty .btn { margin-top: 8px; }
.avatar { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--bg); font: 750 13px/1 var(--f-display); }
.pop-wrap { position: relative; }
.pop { position: absolute; z-index: 60; top: calc(100% + 8px); right: 0; min-width: 230px; padding: 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.menu { display: grid; }
.menu-me { display: grid; padding: 8px 12px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); line-height: 1.3; }
.menu-me span { font-size: 12.5px; color: var(--ink-3); }
.menu button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; font-weight: 600; font-size: 14.5px; text-align: left; }
.menu button:hover { background: var(--surface-2); }
.menu button.danger { background: var(--urgent-soft); color: var(--urgent); }

/* Recommended area and the full catalogue */
.sec { display: grid; gap: 16px; }
.sec + .sec { margin-top: 16px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.sec-head h2 { display: inline-flex; align-items: center; gap: 9px; font: 800 24px/1.15 var(--f-display); letter-spacing: -.025em; }
.sec-head span { color: var(--ink-3); font-size: 14px; }
.sec-rec { padding: 22px; border-radius: 22px; background: color-mix(in srgb, var(--accent-2) 6%, var(--bg)); border: 1px solid color-mix(in srgb, var(--accent-2) 16%, var(--line)); }
.sec-rec .sec-head h2 .ic { color: var(--accent-2); }
.sec-empty { padding: 18px; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--ink-2); text-align: center; }
.center-btn { justify-self: center; }
.browse { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.browse .tabs { flex: 1 1 320px; min-width: 0; }
.home-in, .sec { grid-template-columns: minmax(0, 1fr); }
.home-in > *, .sec > * { min-width: 0; }
.search { position: relative; display: block; flex: 0 0 240px; }
.search .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 40px; padding: 0 14px 0 38px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; }
.search input:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 16%, transparent); }
.card-off .card-t { color: var(--ink-2); }
.ci-req { font-size: 12.5px; font-weight: 700; color: var(--ink-3); padding: 0 6px; }
.ci-intro { margin-top: -14px; }
.ci-name { max-width: 480px; height: 64px; padding: 0 18px; border-radius: 14px; font: 700 24px/1 var(--f-display); }
@media (max-width: 760px) {
  .search { flex: 1 1 100%; }
  .sec-rec { padding: 16px; margin: 0 -4px; }
}

/* ---------- Detail drawer ---------- */
.drawer-wrap { position: fixed; inset: 0; z-index: 100; }
.drawer-back { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); box-shadow: var(--shadow-lg); padding: calc(24px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) 0 28px; outline: none; animation: slideIn .3s var(--ease); }
@keyframes slideIn { from { transform: translateX(32px); opacity: .5; } }
.drawer-x { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; }
.det { display: grid; gap: 20px; }
.det-t { font: 800 clamp(1.6rem, 3vw, 2rem)/1.12 var(--f-display); letter-spacing: -.03em; margin-top: -8px; }
.det-o { color: var(--ink-2); margin-top: -12px; }
.det-sum { color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; border-radius: 14px; overflow: hidden; background: var(--line); border: 1px solid var(--line); }
.facts > div { display: grid; gap: 3px; align-content: start; padding: 12px 14px; background: var(--surface); min-width: 0; }
.facts span { font-size: 12.5px; color: var(--ink-3); }
.facts b { font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.facts b.urgent { color: var(--urgent); }
.facts small { font-size: 12px; color: var(--ink-3); }
.why { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding: 16px; border-radius: 14px; background: var(--surface-2); }
.why > div { display: grid; gap: 6px; }
.why b { font: 750 16px var(--f-display); }
.why ul { display: grid; gap: 4px; }
.why li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.why li .ic { margin-top: 3px; color: var(--ink-3); }
.why li.ok .ic { color: var(--ok); }
.needs-wrap { display: grid; gap: 10px; }
.needs-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.needs-head b { font: 750 17px var(--f-display); }
.needs-head span { font-size: 13.5px; color: var(--ink-3); }
.needs-wrap .prog > span { background: var(--ok); }
.needs { display: grid; margin-top: 4px; }
.need { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.need:last-child { border-bottom: 0; }
.need-box { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--ink-3); color: #fff; transition: background .15s, border-color .15s; }
.need-box:hover:not(:disabled) { border-color: var(--ok); }
.need-box:disabled { cursor: default; border-style: dashed; }
.need.done .need-box { background: var(--ok); border-color: var(--ok); border-style: solid; }
.need-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; padding: 2px 0; text-align: left; }
.need-main:disabled { cursor: default; }
.need-tx { display: grid; line-height: 1.35; min-width: 0; }
.need-tx b { font-size: 15px; font-weight: 650; }
.need.done .need-tx b { color: var(--ink-3); }
.need-tx small { font-size: 13px; color: var(--ink-3); }
.need-chev { color: var(--ink-3); transition: transform .2s var(--ease); }
.need.open .need-chev { transform: rotate(180deg); }
.need-how { grid-column: 2; display: grid; gap: 10px; padding: 10px 0 4px; }
.need-how ol { counter-reset: s; display: grid; gap: 8px; }
.need-how li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }
.need-how li::before { content: counter(s); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--ink); font-size: 12px; font-weight: 700; }
.need-local { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
.need-local .ic { margin-top: 3px; color: var(--ink-3); }
.det-actions { position: sticky; bottom: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin: 0 -28px; padding: 16px 28px calc(20px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--surface) 26%); }

/* ---------- Photos ---------- */
.ph { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--surface-2); color: var(--ink-3); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph[data-t="internship"] { background: color-mix(in srgb, var(--t-internship) 14%, var(--surface-2)); color: var(--t-internship); }
.ph[data-t="scholarship"] { background: color-mix(in srgb, var(--t-scholarship) 14%, var(--surface-2)); color: var(--t-scholarship); }
.ph[data-t="shadowing"] { background: color-mix(in srgb, var(--t-shadowing) 14%, var(--surface-2)); color: var(--t-shadowing); }
.ph[data-t="postgrad"] { background: color-mix(in srgb, var(--t-postgrad) 14%, var(--surface-2)); color: var(--t-postgrad); }
.card { overflow: hidden; }
.card-img { height: 132px; margin: -20px -20px 0; }
.card-img img { transition: transform .5s var(--ease); }
.card:hover .card-img img { transform: scale(1.04); }
.card-off .card-img img { filter: grayscale(.7); opacity: .75; }
.det-img { height: 200px; border-radius: 16px; margin-top: 30px; }
.drawer-x { z-index: 2; background: var(--surface); box-shadow: var(--shadow-sm); }

.credits .det-t { margin-top: 0; padding-right: 48px; }
.credits-sub { color: var(--ink-2); font-size: 14.5px; }
.credits-list { display: grid; gap: 10px; }
.credits-list li { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; }
.credits-list img { width: 72px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--surface-2); }
.credits-list li > span { display: grid; gap: 1px; min-width: 0; font-size: 13.5px; line-height: 1.35; }
.credits-list a { font-weight: 650; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.credits-list a:hover { text-decoration: underline; }
.credits-list li > span > span { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-foot { margin-top: 24px; }

/* ---------- My applications ---------- */
.apps { display: grid; gap: 10px; }
.app { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; grid-template-areas: "img main dates" "img info dates"; gap: 6px 16px; align-items: center; width: 100%; padding: 12px 16px 12px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; transition: box-shadow .2s var(--ease), transform .2s var(--ease); }
.app:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.app-img { grid-area: img; align-self: start; width: 64px; height: 64px; border-radius: 12px; }
.app-main { grid-area: main; display: grid; gap: 2px; min-width: 0; }
.app-main b { font: 750 16px/1.25 var(--f-display); }
.app-main > span:last-child { font-size: 13.5px; color: var(--ink-2); }
.app-info { grid-area: info; display: flex; flex-wrap: wrap; gap: 6px; }
.app-info .tag { height: 26px; font-size: 12.5px; }
.app-dates { grid-area: dates; display: grid; grid-auto-flow: column; gap: 20px; text-align: right; }
.app-dates > span { display: grid; gap: 1px; }
.app-dates small { font-size: 12px; color: var(--ink-3); }
.app-dates b { font: 750 15px/1.2 var(--f-display); }
.app-dates em { font-style: normal; font-size: 12px; font-weight: 650; color: var(--ok); }
.applied-note { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--ok-soft); color: var(--ok); font-size: 14.5px; }
.applied-note span { color: var(--ink); }
.ask-link { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; color: var(--ink); transition: border-color .15s; }
.ask-link:hover { border-color: var(--ink-3); }
.ask-link-ic { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: #fff; }
.ask-link > span:nth-child(2) { display: grid; line-height: 1.3; }
.ask-link b { font-size: 15px; }
.ask-link > span:nth-child(2) > span { font-size: 13px; color: var(--ink-3); }

/* ---------- Compass ---------- */
.fab { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 20px 0 7px; border-radius: 99px; background: var(--ink); color: var(--bg); font: 700 15px/1 var(--f-display); box-shadow: var(--shadow-lg); transition: transform .2s var(--ease); }
.fab:hover { transform: translateY(-2px); }
.fab-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; }
.compass { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 110; display: flex; flex-direction: column; width: min(400px, calc(100vw - 40px)); height: min(620px, calc(100dvh - 40px)); overflow: hidden; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); animation: cpIn .25s var(--ease); }
@keyframes cpIn { from { transform: translateY(16px) scale(.98); } }
.cp-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 10px 12px 14px; border-bottom: 1px solid var(--line); }
.cp-av { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; }
.cp-id { display: grid; line-height: 1.25; min-width: 0; }
.cp-id b { font: 750 16px var(--f-display); }
.cp-id span { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-about { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 14px; background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); }
.cp-about b { color: var(--ink); }
.cp-about button { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: var(--ink-3); flex: none; }
.cp-about button:hover { background: var(--line); color: var(--ink); }
.cp-msgs { flex: 1 1 auto; min-height: 0; display: grid; gap: 10px; align-content: start; padding: 16px; overflow-y: auto; overscroll-behavior: contain; }
.cp-msg { display: grid; gap: 6px; max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; }
.cp-msg.ai { justify-self: start; background: var(--surface-2); border-bottom-left-radius: 5px; }
.cp-msg.me { justify-self: end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 5px; }
.cp-msg ul { display: grid; gap: 4px; padding-left: 18px; list-style: disc; }
.cp-typing { display: inline-flex; gap: 4px; padding: 5px 2px; }
.cp-typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; }
.cp-typing span:nth-child(2) { animation-delay: .15s; }
.cp-typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.cp-links { display: grid; gap: 6px; margin-top: 2px; }
.cp-link { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 9px; width: 100%; padding: 9px 11px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 13.5px; font-weight: 650; text-align: left; transition: border-color .15s, transform .15s; }
.cp-link:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.cp-link-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-sugg { display: grid; gap: 8px; }
.cp-sugg button { justify-self: start; padding: 9px 13px; border-radius: 12px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; text-align: left; transition: border-color .15s; }
.cp-sugg button:hover { border-color: var(--ink-3); }
.cp-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.cp-in { height: 46px; padding: 0 14px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 15px; }
.cp-in:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 16%, transparent); }
.cp-send { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; background: var(--ink); color: var(--bg); }
.cp-send:disabled { opacity: .3; cursor: default; }
@media (max-width: 640px) {
  .app { grid-template-columns: 56px minmax(0, 1fr); grid-template-areas: "img main" "dates dates" "info info"; }
  .app-img { width: 56px; height: 56px; }
  .app-dates { justify-content: start; text-align: left; }
  .compass { inset: 0; width: auto; height: auto; border-radius: 0; border: 0; padding-top: env(safe-area-inset-top, 0px); }
  .fab { padding: 0 7px; }
  .fab-tx { display: none; }
  .home-in { padding-bottom: 110px; }
}

@media (max-width: 400px) {
  .top { gap: 4px; }
  .top .btn-sm { padding: 0 10px; }
  .logo { font-size: 18px; gap: 7px; }
}


/* ---------- Waypoint Pro ---------- */
.pro-pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; margin-right: 8px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); font: 700 13.5px/1 var(--f-display); white-space: nowrap; transition: background-color .15s; }
.pro-pill:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.pro-pill.on { background: var(--accent); border-color: transparent; color: #fff; }
.fab-pro { padding: 4px 7px; margin-left: -2px; border-radius: 6px; background: var(--accent); color: #fff; font: 800 11px/1 var(--f-display); letter-spacing: .05em; }
.pro-wrap { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 20px; }
.pro-back { position: absolute; inset: 0; background: rgba(5, 7, 12, .62); }
.pro-sheet { position: relative; display: grid; gap: 16px; width: min(460px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; padding: 28px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); outline: none; animation: cpIn .25s var(--ease); }
.pro-x { position: absolute; top: 12px; right: 12px; }
.pro-badge { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); font: 700 13px/1 var(--f-display); }
.pro-h { font: 800 28px/1.12 var(--f-display); letter-spacing: -.02em; padding-right: 36px; }
.pro-sub { color: var(--ink-2); font-size: 15px; }
.pro-feats { display: grid; gap: 12px; }
.pro-feats li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.pro-ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); color: var(--accent); }
.pro-feats li > span:last-child { display: grid; line-height: 1.3; }
.pro-feats b { font-size: 15px; }
.pro-feats li > span:last-child > span { font-size: 13.5px; color: var(--ink-2); }
.pro-plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pro-plan { display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); text-align: left; transition: border-color .15s, background-color .15s; }
.pro-plan.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.pro-plan-l { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.pro-plan-l em { font-style: normal; font-size: 11.5px; font-weight: 800; color: var(--ok); }
.pro-plan-p { font-size: 13px; color: var(--ink-2); }
.pro-plan-p b { font: 800 22px/1 var(--f-display); color: var(--ink); }
.pro-fine { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; color: var(--ink-3); }
.pro-fine svg { flex: none; margin-top: 2px; }
.plans { display: grid; gap: 22px; padding-top: 8px; padding-bottom: 72px; }
.plans-h { font: 800 clamp(1.7rem, 3.4vw, 2.4rem)/1.1 var(--f-display); letter-spacing: -.03em; text-align: center; }
.plans-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
.plan-card { display: grid; gap: 14px; align-content: start; padding: 26px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.plan-card.on { border: 1.5px solid var(--accent); box-shadow: var(--shadow-md); }
.plan-name { display: inline-flex; align-items: center; gap: 8px; font: 800 18px/1 var(--f-display); }
.plan-card.on .plan-name { color: var(--accent); }
.plan-price { color: var(--ink-2); font-size: 14.5px; }
.plan-price b { font: 800 34px/1 var(--f-display); color: var(--ink); margin-right: 4px; }
.plan-list { display: grid; gap: 10px; margin-bottom: 6px; }
.plan-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 15px; }
.plan-list svg { color: var(--ok); margin-top: 3px; }
@media (max-width: 640px) {
  .pro-wrap { place-items: end center; padding: 0; }
  .pro-sheet { width: 100%; border-radius: 22px 22px 0 0; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .plans-grid { grid-template-columns: minmax(0, 1fr); }
  .pro-pill { padding: 0 10px; margin-right: 4px; }
}


/* ---------- Header tabs ---------- */
.topnav { display: flex; gap: 4px; margin-left: 18px; }
.topnav-a { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 10px; color: var(--ink-2); font: 650 14.5px/1 var(--f-display); text-decoration: none; transition: background-color .15s, color .15s; }
.topnav-a:hover { color: var(--ink); background: var(--surface-2); }
.topnav-a.on { color: var(--ink); background: var(--surface-2); }

/* ---------- Warnings ---------- */
.warn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, #F59E0B 13%, var(--surface)); border: 1px solid color-mix(in srgb, #F59E0B 38%, transparent); color: var(--warn); }
.warn > span { display: grid; gap: 2px; color: var(--ink); font-size: 14px; line-height: 1.4; }
.warn > span > b { font-size: 14.5px; }
.warn > span > span { color: var(--ink-2); }
.warn .btn-link { justify-self: start; margin-top: 4px; font-size: 14px; }
.app { grid-template-areas: "img main dates" "img info dates" "img warn warn"; }
.app-warn { grid-area: warn; display: flex; align-items: center; gap: 7px; margin-top: 2px; font-size: 13px; font-weight: 650; color: var(--warn); }
.app-warn.ok { color: var(--ok); }
.app-warn svg { flex: none; }

/* ---------- Apply sheet ---------- */
.apply-badge { background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); }
.apply-list { display: grid; gap: 2px; border-radius: 14px; background: var(--surface-2); padding: 6px; }
.apply-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; }
.apply-list li > svg { color: var(--ink-3); }
.apply-list li.ok > svg { color: var(--ok); }
.apply-list li.miss > svg { color: #F59E0B; }
.apply-list li > span { display: grid; line-height: 1.3; min-width: 0; }
.apply-list b { font-size: 14.5px; }
.apply-list li > span > span { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.apply-list li.miss > span > span { color: var(--warn); font-weight: 650; }
.apply-done { justify-self: start; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); }
.need-up { margin-top: 10px; }

/* ---------- My documents ---------- */
.docs-meter { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline; padding: 16px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.docs-meter b { font: 800 22px/1 var(--f-display); }
.docs-meter span { color: var(--ink-2); font-size: 14.5px; }
.docs-meter .prog { grid-column: 1 / -1; margin-top: 8px; }
.docs-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.docs-form .field { margin: 0; }
.docs { display: grid; gap: 8px; }
.doc { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.doc-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: var(--surface-2); color: var(--ink-2); }
.doc.ok .doc-ic { background: var(--ok-soft); color: var(--ok); }
.doc-main { display: grid; gap: 2px; min-width: 0; line-height: 1.3; }
.doc-main b { font-size: 15.5px; }
.doc-main > span { font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc.ok .doc-main > span { color: var(--ink-2); }
.doc-acts { display: flex; align-items: center; gap: 6px; }
.doc-x { width: 34px; height: 34px; }
.docs-fine { display: flex; align-items: center; gap: 6px; justify-content: center; margin-top: 8px; }

/* ---------- Compass long answers ---------- */
.cp-body.clamp { max-height: 12.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.cp-more { justify-self: start; font-size: 13.5px; font-weight: 700; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 640px) {
  .topnav { margin-left: 8px; }
  .home .top .logo > span { display: none; }
  .pro-pill-tx { display: none; }
  .pro-pill { width: 34px; padding: 0; justify-content: center; }
  .docs-form { grid-template-columns: minmax(0, 1fr); }
  .doc { grid-template-columns: auto minmax(0, 1fr); }
  .doc-acts { grid-column: 1 / -1; justify-content: flex-end; }
  .app { grid-template-areas: "img main" "dates dates" "info info" "warn warn"; }
}


/* ---------- Header tab count ---------- */
.topnav-a { position: relative; }
.topnav-n { font-style: normal; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: #fff; font: 800 11.5px/20px var(--f-display); text-align: center; }

/* ---------- Quick picks (swipe) ---------- */
.swipe { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 32px; align-items: center; padding: 32px 36px; border-radius: 24px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 9%, var(--surface)), var(--surface) 60%); border: 1px solid var(--line); outline: none; }
.swipe:focus-visible { box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 30%, transparent); }
.swipe-side { display: grid; gap: 14px; align-content: center; }
.swipe-h { display: flex; align-items: center; gap: 12px; font: 800 clamp(30px, 3.4vw, 40px)/1.05 var(--f-display); letter-spacing: -.03em; }
.swipe-h svg { color: var(--accent); }
.swipe-p { color: var(--ink-2); font-size: 15.5px; max-width: 30em; }
.swipe-stats { display: flex; gap: 26px; }
.swipe-stats span { display: grid; font-size: 13px; color: var(--ink-3); }
.swipe-stats b { font: 800 24px/1.1 var(--f-display); color: var(--ink); }
.swipe-bar { display: grid; gap: 16px; justify-items: start; }
.pz-s { display: none; }
.swipe-keys { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); }
.swipe-keys kbd { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; background: var(--surface); color: var(--ink-2); font: 700 12px/1 var(--f-display); }
.swipe-keys kbd + kbd { margin-right: 4px; }
@media (hover: none) { .swipe-keys { display: none; } }
.swipe-stage { display: grid; gap: 16px; justify-items: center; }
.sw-stack { position: relative; width: 100%; max-width: 380px; height: 470px; }
.sw-card { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(140px, 1fr) auto; overflow: hidden; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; --like: 0; --nope: 0; animation: swIn .3s var(--ease); }
.sw-card:active { cursor: grabbing; }
.sw-card.sw-next { transform: translateY(14px) scale(.94); pointer-events: none; animation: none; box-shadow: var(--shadow-sm); }
@keyframes swIn { from { transform: translateY(14px) scale(.94); } }
.sw-img { position: relative; }
.sw-img .ph { position: absolute; inset: 0; }
.sw-card img { -webkit-user-drag: none; pointer-events: none; }
.stamp { position: absolute; top: 18px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 10px; font: 800 22px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; background: rgba(5, 7, 12, .45); pointer-events: none; }
.stamp.like { left: 18px; color: #34D399; transform: rotate(-12deg); opacity: var(--like); }
.stamp.nope { right: 18px; color: #F87171; transform: rotate(12deg); opacity: var(--nope); }
.sw-body { display: grid; gap: 12px; align-content: start; padding: 16px 18px 18px; }
.sw-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.sw-tx { display: grid; gap: 4px; min-width: 0; }
.sw-t { font: 800 20px/1.2 var(--f-display); letter-spacing: -.01em; }
.sw-o { font-size: 13.5px; color: var(--ink-2); }
.sw-pts { display: grid; gap: 6px; padding-left: 18px; list-style: disc; font-size: 14px; color: var(--ink-2); }
.sw-pts li::marker { color: var(--accent); }
.sw-pts li span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw-btns { display: flex; align-items: center; gap: 16px; }
.sw-btn { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); color: var(--ink-2); transition: transform .15s var(--ease), box-shadow .15s; }
.sw-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.sw-btn.like, .sw-btn.nope { width: 64px; height: 64px; }
.sw-btn.like { color: #fff; background: var(--ok); border-color: transparent; }
.sw-btn.nope { color: var(--urgent); }
.sw-btn:disabled { opacity: .35; cursor: default; transform: none; box-shadow: none; }
.picks { width: 100%; max-width: 400px; display: grid; gap: 12px; padding: 18px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-md); }
.picks-h { font: 800 18px/1.2 var(--f-display); }
.picks-list { display: grid; gap: 4px; max-height: 300px; overflow-y: auto; }
.pick { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 6px; border-radius: 12px; text-align: left; color: var(--ink-3); }
.pick:hover { background: var(--surface-2); }
.pick-img { width: 52px; height: 52px; border-radius: 10px; }
.pick-tx { display: grid; line-height: 1.3; min-width: 0; }
.pick-tx b { font-size: 14.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-tx span { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picks-empty { color: var(--ink-2); font-size: 14.5px; }
.picks-acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.swipe-end { display: grid; gap: 10px; justify-items: center; text-align: center; max-width: 340px; padding: 30px 20px; }
.swipe-end-ic { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: var(--surface-2); color: var(--accent); }
.swipe-end b { font: 800 20px/1.2 var(--f-display); }
.swipe-end p { color: var(--ink-2); font-size: 14.5px; }

/* ---------- Saved ---------- */
.empty-card { display: grid; justify-items: center; gap: 12px; padding: 44px 20px; border-radius: 20px; background: var(--surface); border: 1px dashed var(--line); text-align: center; }
.empty-card b { font: 800 19px/1.2 var(--f-display); }
.empty-ic { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); }

/* ---------- Calendar ---------- */
.cal { display: grid; gap: 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cal-title { font: 800 26px/1.1 var(--f-display); letter-spacing: -.02em; }
.cal-nav { display: flex; align-items: center; gap: 6px; }
.cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 13.5px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 10px; height: 10px; border-radius: 3px; }
.lg.deadline i { background: var(--accent); }
.lg.start i { background: var(--ok); }
.cal-note { color: var(--ink-3); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
.cal-wd { padding: 10px 8px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line); }
.cal-day { position: relative; display: grid; grid-template-rows: auto 1fr; align-content: start; gap: 5px; min-height: 108px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; outline: none; transition: background-color .12s; }
.cal-day:nth-child(7n) { border-right: 0; }
.cal-day:hover, .cal-day:focus-visible { background: var(--surface-2); }
.cal-day.out { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.cal-day.out .cal-num { color: var(--ink-3); }
.cal-num { font: 700 14px/26px var(--f-display); height: 26px; }
.cal-day.today .cal-num { display: grid; place-items: center; width: 26px; border-radius: 50%; background: var(--accent); color: #fff; line-height: 1; }
.cal-day.sel { box-shadow: inset 0 0 0 2px var(--ink-2); }
.cal-evs { display: grid; gap: 3px; align-content: start; min-width: 0; }
.cal-ev { display: block; padding: 3px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 700; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-ev:hover { filter: brightness(1.15); }
.cal-ev.deadline { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.cal-ev.start { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.cal-more { font-size: 11.5px; color: var(--ink-3); padding-left: 6px; }
.cal-dots { display: none; gap: 3px; justify-content: center; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; }
.cal-dots i.deadline { background: var(--accent); }
.cal-dots i.start { background: var(--ok); }
.cal-agenda { display: grid; gap: 10px; margin-top: 8px; }
.cal-agenda-h { display: flex; align-items: center; justify-content: space-between; }
.cal-agenda-h h3 { font: 800 19px/1.2 var(--f-display); }
.agenda { display: grid; gap: 8px; }
.ag { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; padding: 10px 14px 10px 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; color: var(--ink-3); transition: border-color .15s; }
.ag:hover { border-color: var(--ink-3); }
.ag-date { display: grid; place-items: center; align-content: center; width: 56px; height: 56px; border-radius: 12px; background: var(--surface-2); line-height: 1.1; }
.ag-date b { font: 800 20px/1 var(--f-display); color: var(--ink); }
.ag-date span { font-size: 12px; text-transform: uppercase; }
.ag-main { display: grid; gap: 2px; min-width: 0; line-height: 1.3; }
.ag-main b { font-size: 15px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-main > span:last-child { font-size: 13px; }
.ag-kind { font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.ag-kind.deadline { color: var(--accent); }
.ag-kind.start { color: var(--ok); }

@media (max-width: 980px) {
  .topnav-a { padding: 0 10px; }
  .topnav-a span { display: none; }
  .topnav-n { position: absolute; top: 1px; right: -2px; min-width: 17px; height: 17px; padding: 0 4px; font-size: 10px; line-height: 17px; }
}
@media (max-width: 860px) {
  .swipe { grid-template-columns: minmax(0, 1fr); padding: 20px; }
  .swipe-keys { display: none; }
}
@media (max-width: 640px) {
  .swipe { padding: 14px; gap: 14px; border-radius: 20px; }
  .swipe-p2 { display: none; }
  .sw-pts li:nth-child(n+4) { display: none; }
  .swipe-side { gap: 10px; }
  .swipe-h { font-size: 26px; gap: 10px; }
  .swipe-h svg { width: 22px; height: 22px; }
  .swipe-p { font-size: 14.5px; }
  .swipe-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .swipe-stats { gap: 18px; }
  .swipe-stats b { font-size: 20px; }
  .pz-l { display: none; }
  .pz-s { display: inline; }
  .sw-stack { height: 410px; }
  .sw-card { grid-template-rows: minmax(120px, 1fr) auto; }
  .sw-body { padding: 14px 16px 16px; gap: 10px; }
  .sw-t { font-size: 18.5px; }
  .cal-day { min-height: 58px; padding: 6px 2px; justify-items: center; }
  .cal-evs { display: none; }
  .cal-dots { display: flex; }
  .cal-wd { padding: 8px 2px; text-align: center; font-size: 11px; }
  .cal-title { font-size: 22px; }
}

/* ---------- Toasts ---------- */
.toasts { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 200; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 650; font-size: 14.5px; box-shadow: var(--shadow-lg); animation: toastIn .25s var(--ease); }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } }

/* ---------- Motion and responsive ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 36px; }
}
@media (max-width: 760px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .opts-2 { grid-template-columns: minmax(0, 1fr); }
  .ci-live { display: none; }
}
@media (max-width: 520px) {
  .hero-vis { padding-top: 40px; }
  .stack-1 { top: 0; }
  .stack-2 { display: none; }
  .auth-card { padding: 24px 20px; }
  .drawer { padding-left: 20px; padding-right: 20px; }
  .det-actions { margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
  .next { grid-template-columns: auto minmax(0, 1fr); }
  .next > .btn { grid-column: 1 / -1; justify-self: start; }
  .next-how { padding-left: 0; }
  .age { gap: 16px; }
}

/* Five header tabs on the narrowest phones (after the 980px rule so it wins) */
@media (max-width: 400px) {
  .topnav { gap: 0; margin-left: 2px; }
  .topnav-a { padding: 0 8px; }
}

</style>

const DAY = 86400000;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysUntil = (d) => Math.round((d - today()) / DAY);
const fmtDate = (d, year) => `${d.getDate()} ${MONTHS[d.getMonth()]}${year ? ' ' + d.getFullYear() : ''}`;
const fmtDay = (d) => `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const pad2 = (n) => String(n).padStart(2, '0');

function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rad = (x) => (x * Math.PI) / 180;
function haversine(a1, o1, a2, o2) {
  const dA = rad(a2 - a1), dO = rad(o2 - o1);
  const s = Math.sin(dA / 2) ** 2 + Math.cos(rad(a1)) * Math.cos(rad(a2)) * Math.sin(dO / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

const roundNice = (n) => {
  const step = n >= 1e6 ? 1e5 : n >= 1e5 ? 1e4 : n >= 1e4 ? 1000 : n >= 1000 ? 100 : 10;
  return Math.round(n / step) * step;
};
function fmtMoney(n, cur) {
  try { return new Intl.NumberFormat('en', { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(n); }
  catch (e) { return `${cur} ${Math.round(n).toLocaleString('en')}`; }
}
const initials = (s) => s.replace(/[^A-Za-z0-9 &]/g, ' ').split(/\s+/).filter((w) => w && !/^(of|the|and|&|for|a)$/i.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join('');

/* ---------- Deadlines ---------- */
function deadlineOf(op) {
  if (op._dl !== undefined) return op._dl;
  const w = op.when || {};
  let d = null;
  if (w.inDays != null) d = addDays(today(), w.inDays);
  else if (w.md) {
    const [m, dd] = w.md.split('-').map(Number);
    const t = today();
    d = new Date(t.getFullYear(), m - 1, dd);
    if (d < t) d = new Date(t.getFullYear() + 1, m - 1, dd);
  }
  op._dl = d;
  return d;
}
function deadlineInfo(op) {
  const d = deadlineOf(op);
  if (!d) return { d: null, days: null, label: 'Rolling', short: 'Rolling', tone: 'calm', est: false };
  const days = daysUntil(d);
  const est = !!(op.when && op.when.md);
  const tone = days <= 14 ? 'urgent' : days <= 45 ? 'soon' : 'calm';
  const label = days === 0 ? 'Closes today' : days === 1 ? 'Closes tomorrow' : days <= 60 ? `Closes in ${days} days` : `Closes ${fmtDate(d)}`;
  return { d, days, label, short: fmtDate(d), tone, est };
}

/* ---------- Local opportunities around a city (fictional organisations) ---------- */
const _localCache = {};
function localOps(cityId) {

  const city = cityOf(cityId);
  if (!city) return [];
  const rnd = seeded('waypoint:' + cityId);
  const list = LOCAL_TPL.map((t, i) => {
    const dist = +(1.2 + Math.pow(rnd(), 1.3) * 40).toFixed(1);
    const brg = Math.round(rnd() * 359);
    const inDays = 6 + Math.round(rnd() * 64);
    const sessionIn = inDays + 4 + Math.round(rnd() * 16);
    const stip = STIPEND[city.cur] || 1000;
    let funding = 'free', fundLabel = t.t === 'shadowing' ? 'Free to attend' : 'Free', value = 0;
    if (t.pay === 'paid') {
      const amt = roundNice(stip * (0.85 + rnd() * 0.45));
      funding = 'paid'; fundLabel = `${fmtMoney(amt, city.cur)} a month`; value = 1500;
    } else if (t.pay === 'bursary') {
      const amt = roundNice(stip * (3 + rnd() * 3));
      funding = 'partial'; fundLabel = `Up to ${fmtMoney(amt, city.cur)}`; value = 4000;
    }
    return {
      id: `loc-${cityId}-${i}`, local: true, sample: true, cityId,
      type: t.t, title: t.title, org: t.org, mono: initials(t.org),
      city: city.name, country: city.country, region: city.region, dist, brg, lat: null, lon: null,
      mode: 'On-site', level: t.st.includes('hs') ? 'School and university students' : 'University students and graduates',
      stages: t.st, age: t.age || null, orig: 'any', fields: [t.f],
      funding, fundLabel, value, duration: t.dur,

      summary: t.sum, covers: [], reqs: t.reqs,

}

const homeCity = (p) => (p && cityOf(p.city)) || cityOf('riyadh');
const homeRegion = (p) => homeCity(p).region;
function allOps(p) { return GLOBAL_OPS.concat(localOps(p && p.city)); }
function opById(id, p) {

  if (g) return g;
  const m = /^loc-(.+)-\d+$/.exec(id);
  if (m) return localOps(m[1]).find((o) => o.id === id) || null;
  return null;
}
/* Distance (km) from the student's home city; null for remote listings. */
function distanceOf(op, p) {
  if (op.local) return op.dist;
  if (op.lat == null) return null;
  const c = homeCity(p);
  return Math.round(haversine(c.lat, c.lon, op.lat, op.lon));
}
function fmtKm(km) { return km == null ? 'Remote' : km < 100 ? `${km} km` : `${Math.round(km).toLocaleString('en')} km`; }

/* ---------- Eligibility ---------- */
const ageRangeOf = (op, p) => (op.ageByStage ? op.ageByStage[p.stage] || null : op.age || null);
function originOk(op, p) {
  const hr = homeRegion(p);
  if (!op.orig || op.orig === 'any') return true;
  if (op.orig.only) return op.orig.only.includes(hr);
  if (op.orig.not) return !op.orig.not.includes(hr);
  return true;
}
function eligibility(op, p) {
  const issues = [];
  const ar = ageRangeOf(op, p);
  let tooYoung = false;
  if (ar && (p.age < ar[0] || p.age > ar[1])) { tooYoung = p.age < ar[0]; issues.push({ k: 'age', text: `Open to ages ${ar[0]}–${ar[1]}` }); }
  let laterStage = false;
  if (!op.stages.includes(p.stage)) {
    const minIdx = Math.min(...op.stages.map((s) => STAGE_ORDER.indexOf(s)));
    laterStage = STAGE_ORDER.indexOf(p.stage) < minIdx;
    issues.push({ k: 'stage', text: laterStage ? `Opens up once you are ${stageOf(STAGE_ORDER[minIdx]).label.toLowerCase()}` : `For ${op.stages.map((s) => stageOf(s).label.toLowerCase()).join(', ')}` });
  }
  if (!originOk(op, p)) issues.push({ k: 'origin', text: op.origNote || 'Nationality rules apply' });
  const later = issues.length > 0 && issues.every((i) => (i.k === 'stage' && laterStage) || (i.k === 'age' && tooYoung));
  return { ok: issues.length === 0, later, issues };
}

/* ---------- Fit ---------- */
function fieldFit(op, p) {
  if (op.fields.includes('any')) return 0.72;
  if (!p.fields || !p.fields.length) return 0.72;
  const ov = op.fields.filter((f) => p.fields.includes(f)).length;
  return ov ? Math.min(1, 0.92 + 0.04 * ov) : 0.12;
}
function destFit(op, p) {

  if (op.region === 'remote') return 0.9;
  const dest = p.dest || [];
  if (!dest.length || dest.includes('any')) return 0.95;
  if (dest.includes(op.region)) return 1;
  if (dest.includes('home') && op.region === homeRegion(p)) return 1;
  return 0.25;
}
const typeOk = (op, p) => !p.types || !p.types.length || p.types.includes(op.type);

const NATIVE_ENGLISH = ['United Kingdom', 'United States', 'Canada', 'Australia', 'New Zealand', 'Ireland', 'Singapore'];

/* ---------- Requirement status ---------- */
function cvScore(cv) {
  if (!cv) return 0;
  let s = 0;
  if (cv.headline && cv.headline.trim()) s += 10;
  if ((cv.education || []).some((e) => e.school && e.qual)) s += 20;
  const ex = (cv.experience || []).filter((e) => e.role).length;
  s += ex >= 2 ? 25 : ex === 1 ? 18 : 0;
  const sk = (cv.skills || []).length;
  s += sk >= 3 ? 15 : sk * 5;
  if ((cv.languages || []).length) s += 10;
  if ((cv.tests || []).some((t) => t.name && t.score)) s += 10;
  if ((cv.activities || []).some((a) => a.title)) s += 10;
  return Math.min(100, s);
}
const hasEnglishTest = (cv) => !!cv && (cv.tests || []).some((t) => /ielts|toefl|duolingo|pte|cambridge/i.test(t.name || '') && t.score);

function reqStatus(r, op, p, st) {
  const g = REQ[r.k] || {};
  if (g.minorOnly && p.age >= 18) return { s: 'na' };
  const docs = st.docs || {};
  switch (r.k) {
    case 'age': {
      const ar = ageRangeOf(op, p);
      if (!ar) return { s: 'met', note: 'No age limit.' };
      const ok = p.age >= ar[0] && p.age <= ar[1];
      return { s: ok ? 'met' : 'todo', note: ok ? `You are ${p.age}. Open to ages ${ar[0]}–${ar[1]}.` : `Open to ages ${ar[0]}–${ar[1]}. You are ${p.age}.` };
    }
    case 'hsdiploma':
      return p.stage === 'hs' ? { s: 'progress', note: 'You will have this when you finish school. Predicted grades are enough to apply.' } : { s: 'met', note: 'Completed.' };
    case 'bachelor':
      if (['grad', 'pg', 'pro'].includes(p.stage)) return { s: 'met', note: 'Completed.' };
      return p.stage === 'ug' ? { s: 'progress', note: 'Final-year students can usually apply before graduating.' } : { s: 'todo', note: 'Comes after your first degree.' };
    case 'master':
      if (p.stage === 'pg') return { s: 'progress', note: 'In progress now.' };
      return p.stage === 'pro' ? { s: 'progress', note: "Counts if your degree is at master's level." } : { s: 'todo', note: "Needs a master's degree first." };
    case 'enrolled':
      return ['hs', 'ug', 'pg'].includes(p.stage) ? { s: 'met', note: 'You are a current student.' } : { s: 'todo', note: 'Usually needs current enrollment or very recent graduation.' };
    case 'workexp':
      if (p.stage === 'pro') return { s: 'met', note: 'You are working now. Keep a log of dates and hours.' };
      return p.stage === 'grad' ? { s: 'progress', note: 'Count your hours from your first role.' } : { s: 'todo', note: 'Builds up after you graduate.' };
    case 'english': {
      if (NATIVE_ENGLISH.includes(homeCity(p).country)) return { s: 'met', note: 'Usually waived when your schooling was in English.' };
      if (hasEnglishTest(st.cv) || docs.english === 'ready') return { s: 'met', note: 'Score on file.' };
      if (docs.english === 'progress') return { s: 'progress', note: 'Preparing now.' };
      return { s: 'todo', note: 'No test score on file yet.' };
    }
    default: {
      const d = docs[r.k];
      return d === 'ready' ? { s: 'met', note: 'Marked as ready.' } : d === 'progress' ? { s: 'progress', note: 'In progress.' } : { s: 'todo', note: '' };

}
function opReadiness(op, p, st) {
  let n = 0, got = 0, met = 0;
  for (const r of op.reqs) {
    const s = reqStatus(r, op, p, st).s;
    if (s === 'na' || (r.opt && s !== 'met')) continue;
    n++;
    if (s === 'met') { got += 1; met++; } else if (s === 'progress') got += 0.5;

}

}

/* ---------- Scoring and matching ---------- */
function scoreOp(op, p, st) {
  const f = fieldFit(op, p), d = destFit(op, p), t = typeOk(op, p) ? 1 : 0.45;
  const rd = opReadiness(op, p, st).pct / 100;
  const km = distanceOf(op, p);
  const near = op.local ? 0.035 - Math.min(op.dist, 40) / 2000 : -Math.min(0.06, (km || 0) / 90000);
  const raw = Math.min(1, 0.34 * f + 0.34 * d + 0.18 * t + 0.14 * rd + near);
  return Math.max(12, Math.min(99, Math.round(100 * Math.pow(raw, 1.25))));
}
const isStrongFit = (op, p) => typeOk(op, p) && fieldFit(op, p) >= 0.72 && destFit(op, p) >= 0.8;

const _memo = { key: '', val: null };
function evaluate(p, st) {
  const key = JSON.stringify([p, st.docs, st.cv && cvScore(st.cv), hasEnglishTest(st.cv)]);
  if (_memo.key === key) return _memo.val;
  const rows = allOps(p).map((op) => {
    const el = eligibility(op, p);
    return { op, el, score: scoreOp(op, p, st), ready: opReadiness(op, p, st), fit: isStrongFit(op, p) };
  });
  rows.sort((a, b) => b.score - a.score || ((deadlineOf(a.op) || 9e15) - (deadlineOf(b.op) || 9e15)));
  _memo.key = key; _memo.val = rows;

}
const matches = (p, st) => evaluate(p, st).filter((r) => r.el.ok && r.fit);
const laterOn = (p, st) => evaluate(p, st).filter((r) => !r.el.ok && r.el.later && fieldFit(r.op, p) >= 0.72 && destFit(r.op, p) >= 0.8 && (!p.types.length || p.types.includes(r.op.type) || r.op.type === 'postgrad'));
const rowOf = (op, p, st) => evaluate(p, st).find((r) => r.op.id === op.id) || { op, el: eligibility(op, p), score: scoreOp(op, p, st), ready: opReadiness(op, p, st), fit: isStrongFit(op, p) };

/* Live count during onboarding: the sample catalog narrowed by whatever has been answered. */
function liveMatches(d) {
  const proxyCity = d.city || 'london';
  const ops = GLOBAL_OPS.concat(localOps(proxyCity));
  const p = { age: d.age ?? 20, stage: d.stage || 'ug', types: d.types || [], fields: d.fields || [], city: proxyCity, dest: d.dest && d.dest.length ? d.dest : ['any'] };
  return ops.filter((op) => {
    if (d.age != null) { const ar = op.ageByStage ? (d.stage ? op.ageByStage[d.stage] : null) : op.age; if (ar && (d.age < ar[0] || d.age > ar[1])) return false; }
    if (d.stage && !op.stages.includes(d.stage)) return false;
    if (d.types && d.types.length && !d.types.includes(op.type)) return false;
    if (d.fields && d.fields.length && fieldFit(op, p) < 0.72) return false;
    if (d.city && !originOk(op, p)) return false;
    if (d.city && d.dest && d.dest.length && destFit(op, p) < 0.8) return false;
    if (!d.city && op.local) return d.fields && d.fields.length ? fieldFit(op, p) >= 0.92 : true;
    return true;
  });
}

/* Why this matches, in plain words. */
function matchReasons(op, p) {
  const out = [];
  const ar = ageRangeOf(op, p);
  out.push({ k: 'age', ok: !ar || (p.age >= ar[0] && p.age <= ar[1]), text: ar ? `Ages ${ar[0]}–${ar[1]}; you are ${p.age}` : 'No age limit' });
  out.push({ k: 'stage', ok: op.stages.includes(p.stage), text: op.stages.includes(p.stage) ? `Open to ${stageOf(p.stage).label.toLowerCase()} applicants` : eligibility(op, p).issues.find((i) => i.k === 'stage').text });
  const ff = fieldFit(op, p);
  const shared = op.fields.filter((f) => p.fields.includes(f)).map((f) => fieldOf(f).label);
  out.push({ k: 'field', ok: ff >= 0.72, text: op.fields.includes('any') ? 'Open to every field' : shared.length ? `Matches your interest in ${shared.join(' and ')}` : `Focused on ${op.fields.map((f) => fieldOf(f).label).join(', ')}` });
  const df = destFit(op, p);
  const km = distanceOf(op, p);
  out.push({ k: 'place', ok: df >= 0.8, text: op.local ? `${km} km from home in ${op.city}` : op.region === 'remote' ? 'Remote, so it works from anywhere' : df >= 0.8 ? `In ${regionName(op.region)}, a region you chose` : `In ${regionName(op.region)}, outside the regions you chose` });

/* ---------- Highest-leverage requirement ---------- */
function nextBestStep(p, st) {
  const ms = matches(p, st).slice(0, 16);
  const tally = (states) => {
    const out = {};
    for (const { op } of ms) for (const r of op.reqs) {
      const g = REQ[r.k];
      if (!g || g.kind !== 'doc' || r.opt || r.k === 'interview') continue;
      if (states.includes(reqStatus(r, op, p, st).s)) (out[r.k] = out[r.k] || new Set()).add(op.id);
    }
    return out;
  };
  let count = tally(['todo']);
  if (!Object.keys(count).length) count = tally(['progress']);
  let best = null;
  for (const k in count) if (!best || count[k].size > count[best].size || (count[k].size === count[best].size && (REQ[k].lead || 0) > (REQ[best].lead || 0))) best = k;
  return best ? { k: best, n: count[best].size, of: ms.length, ids: [...count[best]] } : null;
}

function profileReadiness(p, st) {
  const ms = matches(p, st);
  if (!ms.length) return cvScore(st.cv);
  return Math.round(ms.reduce((a, r) => a + r.ready.pct, 0) / ms.length);
}

/* Documents the student's matches ask for, most-used first. */
function docNeeds(p, st) {
  const need = {};
  const base = ['cv', 'transcript', 'statement', 'refs', 'passport', 'english'];
  base.forEach((k) => (need[k] = new Set()));
  for (const { op } of matches(p, st)) for (const r of op.reqs) {
    const g = REQ[r.k];
    if (!g || g.kind !== 'doc' || r.k === 'interview') continue;
    if (g.minorOnly && p.age >= 18) continue;
    (need[r.k] = need[r.k] || new Set()).add(op.id);
  }
  return Object.keys(need).map((k) => ({ k, n: need[k].size })).sort((a, b) => b.n - a.n);

/* ---------- Route planning ---------- */
const REQ_ACTION = {
  english: 'Book and sit an English test', refs: 'Ask for recommendation letters', statement: 'Draft your personal statement',
  cv: 'Finish your CV', transcript: 'Request official transcripts', passport: 'Check or renew your passport',
  consent: 'Get parent or guardian consent', schoolletter: 'Get a school enrollment letter', health: 'Collect health and vaccination records',
  portfolio: 'Build your portfolio', research: 'Write your research proposal', gre: 'Sit the GRE or GMAT', exam: 'Prepare for the entrance test',
  coding: 'Practise for the coding assessment', offer: 'Apply to the university course', video: 'Record your video statement',
  leadership: 'Write up your leadership record', need: 'Gather evidence of financial need', interview: 'Prepare for interviews',
};
function buildRoute(p, st) {
  const T = today();
  let targets = (st.saved || []).map((id) => opById(id, p)).filter(Boolean);
  const auto = targets.length === 0;
  if (auto) targets = matches(p, st).map((r) => r.op).filter((o) => o.type !== 'shadowing').slice(0, 4);
  const steps = new Map();
  const add = (s) => {
    const cur = steps.get(s.id);
    if (!cur) { steps.set(s.id, s); return; }
    if (s.date < cur.date) cur.date = s.date;
    cur.for = [...new Set(cur.for.concat(s.for))];
    cur.tight = cur.tight || s.tight;
  };
  for (const o of targets) {
    const dl = deadlineOf(o);
    const end = dl || addDays(T, 45);
    for (const r of o.reqs) {
      const g = REQ[r.k];
      if (!g || g.kind !== 'doc' || r.opt) continue;
      const s = reqStatus(r, o, p, st).s;
      if (s === 'na') continue;
      if (r.k === 'interview') {
        add({ id: 'int:' + o.id, kind: 'interview', date: addDays(end, 21), title: 'Prepare for interviews', detail: o.title, line: o.type, for: [o.id], req: 'interview' });
        continue;
      }
      let date = addDays(end, -(g.lead || 21));
      let tight = false;
      if (date < T) { date = T; tight = true; }
      add({ id: 'req:' + r.k, kind: 'req', req: r.k, date, title: REQ_ACTION[r.k] || g.label, line: 'req', for: [o.id], tight });
    }
    const sub = dl ? (addDays(dl, -2) < T ? T : addDays(dl, -2)) : addDays(T, 45);
    add({ id: 'sub:' + o.id, kind: 'submit', date: sub, title: `Submit ${o.title}`, detail: o.org, line: o.type, for: [o.id], deadline: dl });
  }
  const exp = matches(p, st).map((r) => r.op).find((o) => o.local && o.type === 'shadowing');
  if (exp) add({ id: 'exp:' + exp.id, kind: 'experience', date: exp.session, title: exp.title, detail: `${exp.org} · ${exp.dist} km from home`, line: 'shadowing', for: [exp.id] });
  (st.customSteps || []).forEach((c) => add({ id: c.id, kind: 'custom', date: new Date(c.date), title: c.title, line: 'custom', for: [] }));
  const list = [...steps.values()].sort((a, b) => a.date - b.date);
  list.forEach((s) => { s.done = stepDone(s, p, st); });
  return { targets, auto, steps: list };
}
function stepDone(s, p, st) {

    if (s.req === 'english') return hasEnglishTest(st.cv) || (st.docs || {}).english === 'ready' || NATIVE_ENGLISH.includes(homeCity(p).country);
    return (st.docs || {})[s.req] === 'ready';
  }
  return !!(st.routeDone || {})[s.id];
}

/* ---------- Labels ---------- */
function destLabel(d, p) {

  return regionName(d);
}
function routeLabel(p) {
  const c = homeCity(p);
